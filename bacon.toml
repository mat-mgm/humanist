# ==============================================================================
# Bacon Configuration (Background Code Checker)
# ==============================================================================
# Usage:
#   bacon           - Runs the default job (check)
#   bacon clippy    - Runs clippy with continuous feedback
#   bacon nextest   - Runs tests via cargo-nextest
#   bacon test      - Runs standard cargo test

default_job = "check"

[jobs.check]
command = ["cargo", "check", "--all-targets"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets", "--all-features"]
need_stdout = false

[jobs.test]
command = ["cargo", "test", "--all-targets"]
need_stdout = true

[jobs.nextest]
command = ["cargo", "nextest", "run", "--all-targets"]
need_stdout = true

[jobs.run]
command = ["cargo", "run"]
need_stdout = true
allow_warnings = true

[jobs.doc]
command = ["cargo", "doc", "--no-deps"]
need_stdout = false

[jobs.doc-open]
command = ["cargo", "doc", "--no-deps", "--open"]
need_stdout = false
on_success = "back"

# Key bindings inside bacon terminal UI
[keybindings]
c = "job:clippy"
t = "job:test"
n = "job:nextest"
r = "job:run"
d = "job:doc"
q = "quit"

[jobs.sweep]
command = ["cargo", "sweep", "--time", "14"]
need_stdout = true

[jobs.cache-clean]
command = ["cargo", "cache", "--autoclean"]
need_stdout = true
